[project]
name = "dbtp"
version = "0.1.0"
description = "Setup, developer-environment and deployment tooling for dbt data products on Databricks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # dbt-core and dbt-databricks are not dependencies: each data product pins them
    # in its own uv.lock, because they change model behaviour.
    "databricks-sdk>=0.50",
    "pyyaml>=6.0",
]

[project.scripts]
dbtp = "dbtp.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
