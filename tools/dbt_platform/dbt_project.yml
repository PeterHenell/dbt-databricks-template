# The platform's dbt macros, as a dbt package: schema and alias naming, source modes,
# personal and MR environment cleanup, the published-interface check and the local
# Spark overrides. It lives in the template for now (installed from packages.yml with
# `local:`), written to move into a repository of its own.
# It knows nothing about the product: it reads the product name from `project_name`
# and only looks at the root project's nodes.
name: dbt_platform
version: "0.1.0"
config-version: 2
require-dbt-version: [">=1.12.0", "<2.0.0"]

macro-paths: ["macros"]
