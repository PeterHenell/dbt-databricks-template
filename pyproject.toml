[project]
name = "dbt-data-product"
version = "0.0.0"
description = "dbt project for one data product on Databricks (from the dbt-databricks template)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core~=1.12.0",
    "dbt-databricks~=1.12.0",
    "dbtp",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "sqlfluff>=3.4",
    "yamllint>=1.37",
]

[tool.uv]
package = false

# The tooling is its own package (tools/dbtp), installed into this environment. It is
# a workspace member for now; once it has its own repository, this source becomes a
# git URL or package index with a version.
[tool.uv.workspace]
members = ["tools/dbtp"]

[tool.uv.sources]
dbtp = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "tools/dbtp/tests"]
