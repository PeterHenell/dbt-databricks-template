[project]
name = "dbt-data-product"
version = "0.0.0"
description = "dbt project for one data product on Databricks (from the dbt-databricks template)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core~=1.12.0",
    "dbt-databricks~=1.12.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
