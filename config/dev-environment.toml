# Team-level settings for personal development environments.
# Committed and not secret: every developer on the team uses the same values.
# Replace the placeholders when you create a repository from the template.

[databricks]
# Server hostname of the dev workspace (SQL Warehouses → your warehouse → Connection
# details, e.g. dbc-1234abcd-5678.cloud.databricks.com), stored with https:// in front.
host = "https://<dev-workspace-host>"
# SQL warehouse ID of the team's shared warehouse (SQL Warehouses → the warehouse: the ID is
# shown next to its name; or the last part of the HTTP path in Connection details).
warehouse_id = "<shared-dev-sql-warehouse-id>"

[catalogs]
# The team catalog: personal environments are schemas in it (ADR 0001).
team = "<team_catalog>"
# This data product's product dev catalog (the release candidate). `make build-changed`
# defers to the manifest its job runs publish in `_dbt_artifacts.state` (ADR 0006).
product_dev = "<product_dev_catalog>"
