# Deployment profile, used ONLY with `--profiles-dir deploy` (ADR 0002).
# Never copy it to the repository root: it would replace every developer's dev profile.
#
# It holds no environment-specific values (ADR 0008). The deployment (Databricks
# Asset Bundle target / CI variables) sets the environment variables, so the same
# file builds the product dev catalog and the product prod catalog.
# Authentication is service principal OAuth (machine-to-machine).
sample_product:
  target: prod
  outputs:
    prod:
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      catalog: "{{ env_var('DBT_CATALOG') }}"
      # Every model sets a layer schema; this is only the fallback for nodes without one.
      schema: default
      auth_type: oauth
      client_id: "{{ env_var('DBT_DATABRICKS_CLIENT_ID') }}"
      client_secret: "{{ env_var('DBT_DATABRICKS_CLIENT_SECRET') }}"
      threads: 8
