# Deployment profile, used ONLY with `--profiles-dir deploy` (ADR 0002).
# Never copy it to the repository root: it would replace every developer's dev profile.
#
# It holds no environment-specific values (ADR 0008). Whoever runs dbt supplies them:
#   DBT_HOST          workspace host. Set by Databricks in the job's dbt task; set by
#                     `dbtp mr-build` in CI.
#   DBT_ACCESS_TOKEN  OAuth token of the identity that runs dbt. Set by Databricks for
#                     the job's run-as identity; set by `dbtp mr-build` from the CI login.
#   --vars '{deploy_catalog: ..., deploy_warehouse_id: ...}'  passed by the bundle's job
#                     (resources/dbt_job.yml) or by dbtp (`mr-build`, `parse`).
sample_product:
  target: prod
  outputs:
    # Product dev and product prod (the bundle's job): plain `<layer>` schemas.
    prod:
      type: databricks
      host: "{{ env_var('DBT_HOST') }}"
      http_path: "/sql/1.0/warehouses/{{ var('deploy_warehouse_id') }}"
      catalog: "{{ var('deploy_catalog') }}"
      # Every model sets a layer schema; this is only the fallback for nodes without one.
      schema: default
      token: "{{ env_var('DBT_ACCESS_TOKEN') }}"
      threads: 8

    # MR builds (ADR 0009): `<product>__mr__<layer>` in the team catalog.
    # The schema must be `<product>__mr` (tests/test_bundle.py checks it).
    mr:
      type: databricks
      host: "{{ env_var('DBT_HOST') }}"
      http_path: "/sql/1.0/warehouses/{{ var('deploy_warehouse_id') }}"
      catalog: "{{ var('deploy_catalog') }}"
      schema: sample_product__mr
      token: "{{ env_var('DBT_ACCESS_TOKEN') }}"
      threads: 8
