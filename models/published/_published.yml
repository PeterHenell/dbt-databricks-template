version: 2

# The published interface, versioned as a whole (ADR 0003). Version N of every model is
# built into schema `vN` under the model's plain name (`v1.customers`, `v2.customers`).
# See docs/published-interface.md for how to add a major version.

models:
  - name: customers
    description: One row per customer, with their order history summarised.
    latest_version: 2
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [customer_id]
    columns:
      - name: customer_id
        data_type: bigint
        constraints:
          - type: not_null
        data_tests: [unique]
      - name: customer_name
        data_type: string
      - name: market_segment
        data_type: string
      - name: number_of_orders
        data_type: bigint
        constraints:
          - type: not_null
      - name: lifetime_value
        data_type: decimal(18,2)
        constraints:
          - type: not_null
      - name: total_order_value
        data_type: decimal(18,2)
        constraints:
          - type: not_null
      - name: first_order_date
        data_type: date
      - name: most_recent_order_date
        data_type: date
    versions:
      - v: 1
        deprecation_date: 2027-06-30
        columns:
          - include: all
            exclude: [total_order_value]
      - v: 2
        columns:
          - include: all
            exclude: [market_segment, lifetime_value]
