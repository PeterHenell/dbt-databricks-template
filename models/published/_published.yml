version: 2

# The published data product: what consumers read, from schema `published`. Every model
# here has an enforced contract (`data_type` on every column). Changing a published
# column is governed by the team, not by tooling (ADR 0010, docs/published-interface.md).

models:
  - name: customers
    description: One row per customer, with their order history summarised.
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [customer_id]
    columns:
      - name: customer_id
        data_type: bigint
        constraints:
          - type: not_null
        data_tests: [unique]
      - name: customer_name
        data_type: string
      - name: number_of_orders
        data_type: bigint
        constraints:
          - type: not_null
      - name: number_of_open_orders
        data_type: bigint
        constraints:
          - type: not_null
      - name: total_order_value
        data_type: decimal(18,2)
        constraints:
          - type: not_null
      - name: first_order_date
        data_type: date
      - name: most_recent_order_date
        data_type: date
