version: 2

models:
  - name: stg_tpch__customers
    description: Customers, renamed to project conventions.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_tpch__orders
    description: Orders, renamed to project conventions.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch__customers')
                field: customer_id
