version: 2

sources:
  - name: tpch
    description: >
      TPC-H sample data, available in every Databricks workspace. Stands in for the
      data product's real upstream sources; replace it when you adopt the template.
    # Source locations come from variables so they can be pointed elsewhere per target or run.
    # The local Spark engine (local/) has no catalogs, only schema.table.
    database: "{{ var('tpch_catalog') if target.type == 'databricks' else none }}"
    schema: "{{ var('tpch_schema') }}"
    tables:
      - name: customer
        description: One row per customer.
        columns:
          - name: c_custkey
            data_tests: [unique, not_null]
      - name: orders
        description: One row per order.
        columns:
          - name: o_orderkey
            data_tests: [unique, not_null]
