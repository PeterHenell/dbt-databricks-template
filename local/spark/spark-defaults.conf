# Spark settings for the local engine (local/compose.yml). The image copies this
# file to SPARK_CONF_DIR, so dbt (session method) and the spark-sql shell share it.

spark.master                                       local[*]
spark.driver.memory                                2g
spark.sql.session.timeZone                         UTC
spark.ui.enabled                                   false

# Table files live in the `spark-warehouse` volume...
spark.sql.warehouse.dir                            /data/warehouse

# ...and the table catalog (Hive metastore) in the Postgres `metastore-db` service,
# so dbt and spark-sql can use it at the same time (unlike Spark's default Derby).
spark.sql.catalogImplementation                    hive
spark.hadoop.javax.jdo.option.ConnectionURL        jdbc:postgresql://metastore-db:5432/metastore
spark.hadoop.javax.jdo.option.ConnectionDriverName org.postgresql.Driver
spark.hadoop.javax.jdo.option.ConnectionUserName   hive
spark.hadoop.javax.jdo.option.ConnectionPassword   hive
# The schema is created by local/metastore/init/*.sql on Postgres' first start;
# creating it lazily from Spark deadlocks.
spark.hadoop.datanucleus.schema.autoCreateAll      false
spark.hadoop.hive.metastore.schema.verification    false

# Delta Lake tables, like on Databricks (jars installed by the image).
spark.sql.extensions                               io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                    org.apache.spark.sql.delta.catalog.DeltaCatalog
