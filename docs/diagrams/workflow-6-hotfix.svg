<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="904px" preserveAspectRatio="none" style="width:2134px;height:904px;background:#FFFFFF;" version="1.1" viewBox="0 0 2134 904" width="2134px" zoomAndPan="magnify"><title>6. Release a fix that is not on main (hotfix, exceptional)</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="441.5811" x="845.1504" y="32.9951">6. Release a fix that is not on main (hotfix, exceptional)</text></g><rect fill="none" height="20.9531" style="stroke:none;stroke-width:1;" width="2101.8818" x="15" y="50.042"/><ellipse cx="176.7666" cy="85.9951" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="311.5332" x="21" y="164.3975"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="291.5332" x="31" y="185.5361">Fix on a feature branch, MR, merge (workflow 1)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="289.0273" x="32.2529" y="218.3662"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.4844" x="42.2529" y="239.5049">Release from main, e.g.</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="43.3477" x="189.5518" y="239.5049">v1.5.1</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="74.5664" x="236.7139" y="239.5049">(workflow 2)</text><ellipse cx="176.7666" cy="283.335" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="176.7666" cy="283.335" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="94.0625,115.9951,259.4707,115.9951,271.4707,127.9951,259.4707,139.9951,94.0625,139.9951,82.0625,127.9951,94.0625,115.9951" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="86.2544" x="180.7666" y="150.2056">yes, the default</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="165.4082" x="94.0625" y="131.8032">Can main be released as it is?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="185.8345" x="271.4707" y="125.4009">no, main holds unreleasable work</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="265.6367" x="43.9482" y="336.335"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="245.6367" x="53.9482" y="357.4736">git&#160;switch&#160;-c&#160;hotfix/v1.5.1&#160;v1.5.0</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="305.2813" x="24.126" y="390.3037"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="21.3809" x="34.126" y="411.4424">Fix;</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="260.0859" x="59.3213" y="411.4424">uv&#160;run&#160;dbt&#160;build&#160;--select&#160;&lt;changed&gt;+</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="177.873" x="34.126" y="425.4111">in your personal environment</text><path d="M289.2461,455.0928 L289.2461,471.2256 L269.2461,475.2256 L289.2461,479.2256 L289.2461,495.3584 A0,0 0 0 0 289.2461,495.3584 L601.6479,495.3584 A0,0 0 0 0 601.6479,495.3584 L601.6479,465.0928 L591.6479,455.0928 L289.2461,455.0928 A0,0 0 0 0 289.2461,455.0928" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M591.6479,455.0928 L591.6479,465.0928 L601.6479,465.0928 L591.6479,455.0928" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.4019" x="295.2461" y="472.1597">Optional: open an MR from the hotfix branch</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.6938" x="295.2461" y="487.2925">for review and an MR build</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="184.959" x="84.2871" y="458.2412"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="57.7969" x="94.2871" y="479.3799">git&#160;push</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="103.3477" x="155.8984" y="479.3799">the hotfix branch</text><path d="M324.0801,809.9912 L324.0801,826.124 L304.0801,830.124 L324.0801,834.124 L324.0801,850.2568 A0,0 0 0 0 324.0801,850.2568 L592.7402,850.2568 A0,0 0 0 0 592.7402,850.2568 L592.7402,819.9912 L582.7402,809.9912 L324.0801,809.9912 A0,0 0 0 0 324.0801,809.9912" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M582.7402,809.9912 L582.7402,819.9912 L592.7402,819.9912 L582.7402,809.9912" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.6602" x="330.0801" y="827.0581">Otherwise the next release from main</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.8413" x="330.0801" y="842.1909">brings the bug back</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="254.627" x="49.4531" y="813.1396"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="234.627" x="59.4531" y="834.2783">Cherry-pick the fix into main via an MR</text><ellipse cx="176.7666" cy="881.2568" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="176.7666" cy="881.2568" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="50.042" y2="892.2568"/><path d="M944.2222,519.1943 L944.2222,535.3271 L924.2222,539.3271 L944.2222,543.3271 L944.2222,559.46 A0,0 0 0 0 944.2222,559.46 L1234.7437,559.46 A0,0 0 0 0 1234.7437,559.46 L1234.7437,529.1943 L1224.7437,519.1943 L944.2222,519.1943 A0,0 0 0 0 944.2222,519.1943" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1224.7437,519.1943 L1224.7437,529.1943 L1234.7437,529.1943 L1224.7437,519.1943" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.5898" x="950.2222" y="536.2612">Deliberate and visible in the history.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.5215" x="950.2222" y="551.394">Without it, release-check refuses the tag.</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="292.918" x="631.3042" y="515.3584"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="254.4902" x="641.3042" y="536.4971">Decide to bypass the "tag is on main" rule</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.8281" x="641.3042" y="550.4658">(e.g. temporarily change</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="115.5938" x="793.9468" y="550.4658">ci-release-check</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="4.6816" x="909.5405" y="550.4658">)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="330.2305" x="612.6479" y="583.2959"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="87.9727" x="622.6479" y="604.4346">Create release</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="43.3477" x="714.4351" y="604.4346">v1.5.1</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.2813" x="761.5972" y="604.4346">on the hotfix branch commit</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="240.2715" x="657.6274" y="759.1709"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="54.8555" x="667.6274" y="780.3096">Undo the</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="115.5938" x="726.2974" y="780.3096">ci-release-check</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="42.1934" x="845.7056" y="780.3096">bypass</text><line style="stroke:#000000;stroke-width:1.5;" x1="606.6479" x2="606.6479" y1="50.042" y2="892.2568"/><path d="M1559.2358,641.1006 L1559.2358,657.2334 L1539.2358,661.2334 L1559.2358,665.2334 L1559.2358,681.3662 A0,0 0 0 0 1559.2358,681.3662 L1840.4009,681.3662 A0,0 0 0 0 1840.4009,681.3662 L1840.4009,651.1006 L1830.4009,641.1006 L1559.2358,641.1006 A0,0 0 0 0 1559.2358,641.1006" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1830.4009,641.1006 L1830.4009,651.1006 L1840.4009,651.1006 L1830.4009,641.1006" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.8765" x="1565.2358" y="658.1675">sample_product-v1.5.1.tar.gz built from</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.165" x="1565.2358" y="673.3003">the hotfix branch; tested in product dev</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="293.4922" x="1245.7437" y="637.2646"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="273.4922" x="1255.7437" y="658.4033">release-artifact &gt; product-dev (deploy + run)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="232.5645" x="1255.7437" y="672.3721">&gt; validate-prod &gt; manual deploy-prod</text><line style="stroke:#000000;stroke-width:1.5;" x1="1239.7437" x2="1239.7437" y1="50.042" y2="892.2568"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="180.2598" x="1891.0811" y="705.2021"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.2598" x="1901.0811" y="726.3408">Prod job updated to v1.5.1</text><line style="stroke:#000000;stroke-width:1.5;" x1="1845.4009" x2="1845.4009" y1="50.042" y2="892.2568"/><line style="stroke:#000000;stroke-width:1.5;" x1="2115.021" x2="2115.021" y1="50.042" y2="892.2568"/><line style="stroke:#181818;stroke-width:1;" x1="176.7666" x2="176.7666" y1="198.3662" y2="218.3662"/><polygon fill="#181818" points="172.7666,208.3662,176.7666,218.3662,180.7666,208.3662,176.7666,212.3662" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="176.7666" x2="176.7666" y1="252.335" y2="272.335"/><polygon fill="#181818" points="172.7666,262.335,176.7666,272.335,180.7666,262.335,176.7666,266.335" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="176.7666" x2="176.7666" y1="139.9951" y2="164.3975"/><polygon fill="#181818" points="172.7666,154.3975,176.7666,164.3975,180.7666,154.3975,176.7666,158.3975" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="271.4707" 