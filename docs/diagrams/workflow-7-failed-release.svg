till from the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.6807" x="250.082" y="153.3276">last successful run (publish task didn't run)</text><line style="stroke:#000000;stroke-width:1.5;" x1="219.082" x2="219.082" y1="50.042" y2="625.2412"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="270.2012" x="619.7158" y="181.3936"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.9648" x="629.7158" y="202.5322">Read the failing dbt output</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="250.2012" x="629.7158" y="216.501">(GitLab job log, or the Databricks job run)</text><path d="M862.1865,302.1514 L862.1865,310.7178 L842.1865,314.7178 L862.1865,318.7178 L862.1865,327.2842 A0,0 0 0 0 862.1865,327.2842 L1180.7393,327.2842 A0,0 0 0 0 1180.7393,327.2842 L1180.7393,312.1514 L1170.7393,302.1514 L862.1865,302.1514 A0,0 0 0 0 862.1865,302.1514" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1170.7393,302.1514 L1170.7393,312.1514 L1180.7393,312.1514 L1170.7393,302.1514" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.5527" x="868.1865" y="319.2183">Same stored archive, deployed and run again</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="174.7402" x="667.4463" y="297.7334"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.7402" x="677.4463" y="318.8721">Retry the product-dev job</text><ellipse cx="754.8164" cy="371.2178" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="754.8164" cy="371.2178" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points=