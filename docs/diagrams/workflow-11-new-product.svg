<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="821px" preserveAspectRatio="none" style="width:1174px;height:821px;background:#FFFFFF;" version="1.1" viewBox="0 0 1174 821" width="1174px" zoomAndPan="magnify"><title>11. Create a new data product from the template</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="389.6621" x="391.0552" y="32.9951">11. Create a new data product from the template</text></g><rect fill="none" height="20.9531" style="stroke:none;stroke-width:1;" width="1141.7725" x="15" y="50.042"/><ellipse cx="240.5898" cy="85.9951" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="315.4648" x="82.8574" y="115.9951"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="295.4648" x="92.8574" y="137.1338">Ask the platform team for: team catalog (if new),</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="282.8262" x="92.8574" y="151.1025">product dev + prod catalogs, SQL warehouses,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="291.3223" x="92.8574" y="165.0713">3 service principals, OIDC policy (team identity),</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="203.9531" x="92.8574" y="179.04">OAuth secrets (product identities)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="249.4473" x="115.8662" y="211.8701"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="43.0371" x="125.8662" y="233.0088">GitLab:</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="182.5957" x="172.7178" y="233.0088">New project from template</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="439.1797" x="21" y="265.8389"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="49.752" x="31" y="286.9775">Rename</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="101.1445" x="84.5664" y="286.9775">sample_product</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="260.6543" x="189.5254" y="286.9775">in dbt_project.yml (name, profile, models:),</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="321.0703" x="31" y="300.9463">deploy/profiles.yml, databricks.yml, local/profiles.yml</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="273.9805" x="103.5996" y="333.7764"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="210.2402" x="113.5996" y="354.915">Fill in config/dev-environment.toml</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="253.9805" x="113.5996" y="368.8838">and the &lt;placeholders&gt; in databricks.yml</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="287.0469" x="97.0664" y="401.7139"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="267.0469" x="107.0664" y="422.8525">Replace the sample tpch source and models</text><path d="M371.7344,452.5342 L371.7344,468.667 L351.7344,472.667 L371.7344,476.667 L371.7344,492.7998 A0,0 0 0 0 371.7344,492.7998 L590.229,492.7998 A0,0 0 0 0 590.229,492.7998 L590.229,462.5342 L580.229,452.5342 L371.7344,452.5342 A0,0 0 0 0 371.7344,452.5342" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M580.229,452.5342 L580.229,462.5342 L590.229,462.5342 L580.229,452.5342" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.4946" x="377.7344" y="469.6011">Fails if the names don't match</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.8379" x="377.7344" y="484.7339">or the bundle doesn't validate</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="222.2891" x="129.4453" y="455.6826"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="202.2891" x="139.4453" y="476.8213">make&#160;test-tooling&#160;lint&#160;parse</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="186.1074" x="147.5361" y="676.6123"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.1074" x="157.5361" y="697.751">Each developer: workflow 0</text><path d="M412.7441,727.4326 L412.7441,743.5654 L392.7441,747.5654 L412.7441,751.5654 L412.7441,767.6982 A0,0 0 0 0 412.7441,767.6982 L675.2026,767.6982 A0,0 0 0 0 675.2026,767.6982 L675.2026,737.4326 L665.2026,727.4326 L412.7441,727.4326 A0,0 0 0 0 412.7441,727.4326" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M665.2026,727.4326 L665.2026,737.4326 L675.2026,737.4326 L665.2026,727.4326" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.4585" x="418.7441" y="744.4995">After the first green product dev run,</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="140.8799" x="418.7441" y="759.6323">make&#160;build-changed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="38.2319" x="563.7563" y="759.6323">works</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="304.3086" x="88.4355" y="730.5811"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="284.3086" x="98.4355" y="751.7197">First MR (workflow 1), first release (workflow 2)</text><ellipse cx="240.5898" cy="798.6982" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="240.5898" cy="798.6982" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="50.042" y2="809.6982"/><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="464.709" x="686.2026" y="512.7998"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="393.9609" x="696.2026" y="533.9385">CI/CD variables: DATABRICKS_OIDC_AUDIENCE, TEAM_CLIENT_ID,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="444.709" x="696.2026" y="547.9072">PRODUCT_DEV_CLIENT_ID/_SECRET, PRODUCT_PROD_CLIENT_ID/_SECRET</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="215.2031" x="696.2026" y="561.876">(product ones masked + protected)</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="305.0352" x="766.0396" y="594.7061"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="87.6445" x="776.0396" y="615.8447">Protected tags</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="14.4492" x="867.4985" y="615.8447">v*</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.4141" x="881.9478" y="615.8447">, protected environment</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="28.8984" x="1032.1763" y="615.8447">prod</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.3711" x="776.0396" y="629.8135">with approvals (Premium/Ultimate),</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.457" x="776.0396" y="643.7822">allow job retries for rollback deployments</text><line style="stroke:#000000;stroke-width:1.5;" x1="680.2026" x2="680.2026" y1="50.042" y2="809.6982"/><line style="stroke:#000000;stroke-width:1.5;" x1="1154.9116" x2="1154.9116" y1="50.042" y2="809.6982"/><line style="stroke:#181818;stroke-width:1;" x1="240.5898" x2="240.5898" y1="95.9951" y2="115.9951"/><polygon fill="#181818" points="236.5898,105.9951,240.5898,115.9951,244.5898,105.9951,240.5898,109.9951" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="240.5898" x2="240.5898" y1="191.8701" y2="211.8701"/><polygon fill="#181818" points="236.5898,201.8701,240.5898,211.8701,244.5898,201.8701,240.5898,205.8701" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="240.5898" x2="240.5898" y1="245.8389" y2="265.8389"/><polygon fill="#181818" points="236.5898,255.8389,240.5898,265.8389,244.5898,255.8389,240.5898,259.8389" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="240.5898" x2="240.5898" y1="313.7764" y2="333.7764"/><polygon fill="#181818" points="236.5898,323.7764,240.5898,333.7764,244.5898,323.7764,240.5898,327.7764" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="240.5898" x2="240.5898" y1="381.7139" y2="401.7139"/><polygon fill="#181818" points="236.5898,391.7139,240.5898,401.7139,244.5898,391.7139,240.5898,395.7