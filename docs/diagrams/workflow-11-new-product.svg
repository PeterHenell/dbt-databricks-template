<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="873px" preserveAspectRatio="none" style="width:1134px;height:873px;background:#FFFFFF;" version="1.1" viewBox="0 0 1134 873" width="1134px" zoomAndPan="magnify"><title>11. Create a new data product from the template</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="389.6621" x="370.7246" y="32.9951">11. Create a new data product from the template</text></g><rect fill="none" height="20.9531" style="stroke:none;stroke-width:1;" width="1101.1113" x="15" y="50.042"/><ellipse cx="199.9287" cy="85.9951" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="315.4648" x="42.1963" y="115.9951"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="295.4648" x="52.1963" y="137.1338">Ask the platform team for: team catalog (if new),</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="282.8262" x="52.1963" y="151.1025">product dev + prod catalogs, SQL warehouses,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="291.3223" x="52.1963" y="165.0713">3 service principals, OIDC policy (team identity),</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="203.9531" x="52.1963" y="179.04">OAuth secrets (product identities)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="249.4473" x="75.2051" y="211.8701"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="43.0371" x="85.2051" y="233.0088">GitLab:</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="182.5957" x="132.0566" y="233.0088">New project from template</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="188.7559" x="105.5508" y="265.8389"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="168.7559" x="115.5508" y="286.9775">Open it in the dev container</text><path d="M287.7256,309.8076 L287.7256,333.5068 L267.7256,337.5068 L287.7256,341.5068 L287.7256,365.2061 A0,0 0 0 0 287.7256,365.2061 L624.0771,365.2061 A0,0 0 0 0 624.0771,365.2061 L624.0771,319.8076 L614.0771,309.8076 L287.7256,309.8076 A0,0 0 0 0 287.7256,309.8076" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M614.0771,309.8076 L614.0771,319.8076 L624.0771,319.8076 L614.0771,309.8076" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.4375" x="293.7256" y="326.8745">Sets the product name everywhere it is needed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.3516" x="293.7256" y="342.0073">config/dev-environment.toml and the dev target</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.7026" x="293.7256" y="357.1401">of databricks.yml</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="135.5938" x="132.1318" y="320.5225"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="115.5938" x="142.1318" y="341.6611">uv&#160;run&#160;dbtp&#160;init</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="314.3867" x="42.7354" y="385.2061"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="294.3867" x="52.7354" y="406.3447">Fill in the prod &lt;placeholders&gt; in databricks.yml</text><path d="M338.2979,436.0264 L338.2979,452.1592 L318.2979,456.1592 L338.2979,460.1592 L338.2979,476.292 A0,0 0 0 0 338.2979,476.292 L590.0034,476.292 A0,0 0 0 0 590.0034,476.292 L590.0034,446.0264 L580.0034,436.0264 L338.2979,436.0264 A0,0 0 0 0 338.2979,436.0264" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M580.0034,436.0264 L580.0034,446.0264 L590.0034,446.0264 L580.0034,436.0264" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.7056" x="344.2979" y="453.0933">The sample models, seed and tests</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.7485" x="344.2979" y="468.2261">build without any changes</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="236.7383" x="81.5596" y="439.1748"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="216.7383" x="91.5596" y="460.3135">make&#160;setup&#160;clone-sources&#160;build</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="357.8574" x="21" y="496.292"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="337.8574" x="31" y="517.4307">Replace the samples with your own sources and models</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="135.7324" x="31" y="531.3994">(docs/first-models.md)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="186.1074" x="106.875" y="728.042"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.1074" x="116.875" y="749.1807">Each developer: workflow 0</text><path d="M372.083,778.8623 L372.083,794.9951 L352.083,798.9951 L372.083,802.9951 L372.083,819.1279 A0,0 0 0 0 372.083,819.1279 L634.5415,819.1279 A0,0 0 0 0 634.5415,819.1279 L634.5415,788.8623 L624.5415,778.8623 L372.083,778.8623 A0,0 0 0 0 372.083,778.8623" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M624.5415,778.8623 L624.5415,788.8623 L634.5415,788.8623 L624.5415,778.8623" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.4585" x="378.083" y="795.9292">After the first green product dev run,</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="140.8799" x="378.083" y="811.062">make&#160;build-changed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="38.2319" x="523.0952" y="811.062">works</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="304.3086" x="47.7744" y="782.0107"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="284.3086" x="57.7744" y="803.1494">First MR (workflow 1), first release (workflow 2)</text><ellipse cx="199.9287" cy="850.1279" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="199.9287" cy="850.1279" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="50.042" y2="861.1279"/><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="464.709" x="645.5415" y="564.2295"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="393.9609" x="655.5415" y="585.3682">CI/CD variables: DATABRICKS_OIDC_AUDIENCE, TEAM_CLIENT_ID,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="444.709" x="655.5415" y="599.3369">PRODUCT_DEV_CLIENT_ID/_SECRET, PRODUCT_PROD_CLIENT_ID/_SECRET</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="215.2031" x="655.5415" y="613.3057">(product ones masked + protected)</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="305.0352" x="725.3784" y="646.1357"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="87.6445" x="735.3784" y="667.2744">Protected tags</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="14.4492" x="826.8374" y="667.2744">v*</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.4141" x="841.2866" y="667.2744">, protected environment</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="28.8984" x="991.5151" y="667.2744">prod</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.3711" x="735.3784" y="681.2432">with approvals (Premium/Ultimate),</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.457" x="735.3784" y="695.2119">allow job retries for rollback deployments</text><line style="stroke:#000000;stroke-width:1.5;" x1="639.5415" x2="639.5415" y1="50.042" y2="861.1279"/><line style="stroke:#000000;stroke-width:1.5;" x1="1114.2505" x2="1114.2505" y1="50.042" y2="861.1279"/><line style="stroke:#181818;stroke-width:1;" x1="199.9287" x2="199.9287" y1="95.9951" y2="115.9951"/><polygon fill="#181818" points="195.9287,105.9951,199.9287,115.9951,203.9287,105.9951,199.9287,109.9951" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="199.9287" x2="199.9287" y1="191.8701" y2="211.8701"/><polygon fill="#181818" points="195.9287,201